# 公開用リポジトリでは .github/workflows/pages.yml に置く。
# 毎日 0:05（日本時間）に作り直して GitHub Pages に出す。手動でも動かせる。
name: build-and-deploy
on:
  schedule:
    - cron: "5 15 * * *"   # UTC 15:05 = JST 0:05
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: build
        run: python3 build.py dist --days 30 --base "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
